<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="hotCurve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#8B6BFF"/>
    </linearGradient>
    <radialGradient id="ambientTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D4AFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6D4AFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="curveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1300" cy="200" r="380" fill="url(#ambientViolet)"/>
  <circle cx="220" cy="220" r="300" fill="url(#ambientTeal)"/>

  <!-- shared origin marker: the moment of first learning -->
  <circle cx="230" cy="240" r="12" fill="#F0FDFA"/>
  <circle cx="230" cy="240" r="30" fill="#5EEAD4" opacity="0.4" filter="url(#dotGlow)"/>

  <!-- forgetting curve: one steep, unbroken decay -->
  <path d="M230,240 C 480,320 620,560 760,660 C 900,745 1060,772 1330,790"
        fill="none" stroke="#818CF8" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>

  <!-- spaced-repetition curve: each review catches the dip and lifts retention higher than before -->
  <path d="M230,240
           C 300,260 350,300 390,330
           S 430,268 460,250
           S 560,290 620,310
           S 665,250 700,233
           S 800,270 860,278
           S 918,222 950,213
           S 1060,240 1120,253
           S 1180,205 1220,197
           S 1300,205 1370,217"
        fill="none" stroke="url(#hotCurve)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#curveGlow)"/>
  <path d="M230,240
           C 300,260 350,300 390,330
           S 430,268 460,250
           S 560,290 620,310
           S 665,250 700,233
           S 800,270 860,278
           S 918,222 950,213
           S 1060,240 1120,253
           S 1180,205 1220,197
           S 1300,205 1370,217"
        fill="none" stroke="url(#hotCurve)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pulse markers: each spaced-repetition review, lifting the retention ceiling -->
  <circle cx="460" cy="250" r="24" fill="#14B8A6" opacity="0.5" filter="url(#dotGlow)"/>
  <circle cx="460" cy="250" r="10" fill="#F0FDFA"/>

  <circle cx="700" cy="233" r="24" fill="#14B8A6" opacity="0.5" filter="url(#dotGlow)"/>
  <circle cx="700" cy="233" r="10" fill="#F0FDFA"/>

  <circle cx="950" cy="213" r="24" fill="#14B8A6" opacity="0.5" filter="url(#dotGlow)"/>
  <circle cx="950" cy="213" r="10" fill="#F0FDFA"/>

  <circle cx="1220" cy="197" r="28" fill="#5EEAD4" opacity="0.55" filter="url(#dotGlow)"/>
  <circle cx="1220" cy="197" r="12" fill="#F0FDFA"/>

  <!-- soft ground line for horizon -->
  <rect x="200" y="800" width="1170" height="2" fill="#A5B4FC" opacity="0.16"/>
</svg>
