<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="bubbleA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4AFF"/>
      <stop offset="1" stop-color="#8B6BFF"/>
    </linearGradient>
    <linearGradient id="bubbleB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D4AFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6D4AFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- warm ambient light behind the conversation, cool light framing it -->
  <circle cx="780" cy="420" r="340" fill="url(#warmGlow)"/>
  <circle cx="1220" cy="220" r="300" fill="url(#ambientViolet)"/>
  <circle cx="300" cy="700" r="300" fill="url(#ambientTeal)"/>

  <!-- shadow pooled beneath the bubbles for depth -->
  <ellipse cx="760" cy="730" rx="420" ry="50" fill="#1E1B4B" opacity="0.4" filter="url(#softShadow)"/>

  <!-- bubble A: the parent's question (large, upper-left) -->
  <path d="M300,240
           h620
           a90,90 0 0 1 90,90
           v230
           a90,90 0 0 1 -90,90
           h-430
           l-95,95
           l10,-95
           h-105
           a90,90 0 0 1 -90,-90
           v-230
           a90,90 0 0 1 90,-90
           z"
        fill="url(#bubbleA)"/>
  <!-- reply typing dots inside bubble A -->
  <circle cx="560" cy="450" r="17" fill="#EDE9FE" opacity="0.92"/>
  <circle cx="620" cy="450" r="17" fill="#EDE9FE" opacity="0.75"/>
  <circle cx="680" cy="450" r="17" fill="#EDE9FE" opacity="0.55"/>

  <!-- bubble B: the school's warm, reassuring answer (smaller, lower-right) -->
  <path d="M910,470
           h330
           a70,70 0 0 1 70,70
           v170
           a70,70 0 0 1 -70,70
           h-90
           l10,80
           l-105,-80
           h-145
           a70,70 0 0 1 -70,-70
           v-170
           a70,70 0 0 1 70,-70
           z"
        fill="url(#bubbleB)"/>
  <!-- a single warm confirming mark: gentle checkmark, pure geometry -->
  <path d="M1010,625 l35,36 l70,-78" fill="none" stroke="#F0FDFA" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- soft highlight glints -->
  <circle cx="380" cy="300" r="16" fill="#FFFFFF" opacity="0.18"/>
  <circle cx="970" cy="520" r="12" fill="#FFFFFF" opacity="0.18"/>
</svg>
