<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" role="img" aria-label="Sckools">
  <!-- THE TASSEL-S — the confirmed Sckools mark: one monoline S (the cord of a
       graduation tassel) with the amber cord and bead beside it. Geometry is
       copied exactly from components/brand/sckools-logo.tsx so the tab icon and
       the in-app logo can never drift. The mark this replaced was a teal-to-
       purple gradient S with NO tassel — an S without the tassel is not the
       logo. White-on-indigo is the brand's tile treatment. -->
  <rect width="52" height="52" rx="12" fill="#4F46E5"/>
  <g transform="translate(-1, 3.8)">
    <path d="M34 14 C34 8.5 25 7.5 19.3 10 C12 13 13.7 19 23.5 21.4 C33.5 24 35.2 29.7 29.3 33.4 C23.6 37 14.6 35.6 13.6 29.4"
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="41" y1="9" x2="41" y2="19" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="41" cy="22" r="3" fill="#F59E0B"/>
  </g>
</svg>
