<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sckools — The Complete Operating System for Schools</title>
<meta name="description" content="Website, admissions desk, fees, registers, report cards, the library, a family app and the TV in reception — one login. Pick the modules your school needs; add more any time.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fcfdff">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/sckools-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Sckools — The Complete Operating System for Schools"><meta property="og:image" content="/og.png">
<style>
/* Sckools marketing — the live "daylight" v5 theme, ported verbatim and evolved.
   Same variables, same motion systems. Changes are marked  ★ FIX  and  ★ NEW. */
.mkt{--paper:#fcfdff;--paper2:#f1f7f8;--card:#fff;--ink:#10243b;--muted:#54687d;--dim:#8ca0b3;--line:#e3ecf2;--line2:#cbdce6;--teal:#0d9488;--teal-hi:#14b8a6;--teal-soft:#d8f3ef;--violet:#6d4aff;--violet-soft:#ece6ff;--coral:#ff7a45;--coral-soft:#ffe9de;--gold:#f5a623;--gold-soft:#fff3d9;--sky:#3aa6dd;--sky-soft:#e0f2fc;--stage1:#083a38;--stage2:#0e5a50;--sh:0 2px 6px rgba(16,36,59,.05),0 18px 40px -18px rgba(16,36,59,.14);--sh-lift:0 4px 10px rgba(16,36,59,.06),0 30px 60px -20px rgba(13,148,136,.25);--r:20px;
  background:var(--paper);color:var(--ink);line-height:1.65;overflow-x:clip;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;font-size:16px;color-scheme:light}
html,body{margin:0;background:#fcfdff}
.mkt *{box-sizing:border-box}
.mkt ::selection{background:rgba(20,184,166,.25)}
.mkt a{color:inherit;text-decoration:none}
.mkt button{font-family:inherit;color:inherit}
.mkt .wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.mkt .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px;color:var(--teal);background:var(--teal-soft);padding:6px 14px;border-radius:999px}
.mkt .eyebrow.coral{color:#d14e1b;background:var(--coral-soft)} .mkt .eyebrow.violet{color:var(--violet);background:var(--violet-soft)} .mkt .eyebrow.gold{color:#b27200;background:var(--gold-soft)}
.mkt h1,.mkt h2,.mkt h3,.mkt h4{font-weight:800;letter-spacing:-.025em;text-wrap:balance;line-height:1.1;margin:0}
.mkt p{margin:0}
.mkt .h-xl{font-size:clamp(2.2rem,4.6vw,3.6rem)} .mkt .h-lg{font-size:clamp(1.6rem,3vw,2.3rem)} .mkt .h-md{font-size:1.3rem}
.mkt .lede{color:var(--muted);font-size:clamp(.98rem,1.3vw,1.1rem);max-width:40rem}
.mkt .btn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:14px 28px;border-radius:999px;cursor:pointer;border:none;font-family:inherit;transition:transform .2s,box-shadow .2s;text-decoration:none}
.mkt .btn:active{transform:scale(.97)}
.mkt .btn-hot{background:linear-gradient(135deg,var(--teal),var(--teal-hi));color:#fff;box-shadow:0 10px 26px -8px rgba(13,148,136,.55);position:relative;overflow:hidden}
.mkt .btn-hot:hover{transform:translateY(-3px);box-shadow:0 16px 34px -8px rgba(13,148,136,.6)}
.mkt .btn-hot::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-120%);transition:transform .7s ease;pointer-events:none}
.mkt .btn-hot:hover::after{transform:translateX(120%)}
.mkt .btn-ink{background:var(--ink);color:#fff;box-shadow:0 10px 26px -10px rgba(16,36,59,.5)} .mkt .btn-ink:hover{transform:translateY(-3px)}
.mkt .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line2)} .mkt .btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.mkt .btn-sm{padding:10px 20px;font-size:13.5px}
/* ★ FIX — the one rule behind the "too big on a phone" complaint. Was a fixed 100px. */
.mkt section{padding:clamp(30px,4vw,52px) 0;position:relative}
.mkt .grid{display:grid;gap:22px}
/* reveals — springy rise; observer adds .in */
.mkt .rv{opacity:0;transform:translateY(34px) scale(.98);transition:opacity .8s cubic-bezier(.16,.8,.26,1),transform .8s cubic-bezier(.16,.8,.26,1)} .mkt .rv.in{opacity:1;transform:none}
.mkt [data-a]{opacity:0;transition:opacity .85s cubic-bezier(.16,.8,.26,1) var(--d,0s),transform .85s cubic-bezier(.16,.8,.26,1) var(--d,0s),filter .85s cubic-bezier(.16,.8,.26,1) var(--d,0s)}
.mkt [data-a='up']{transform:translateY(40px)} .mkt [data-a='left']{transform:translateX(-48px)} .mkt [data-a='right']{transform:translateX(48px)} .mkt [data-a='zoom']{transform:scale(.92)} .mkt [data-a='blur']{filter:blur(10px);transform:translateY(18px)}
.mkt [data-a].in{opacity:1;transform:none;filter:none}
.mkt .hrv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.16,.8,.26,1) var(--d,0s),transform .8s cubic-bezier(.16,.8,.26,1) var(--d,0s)} .mkt .hrv.r{transform:translateX(48px)} .mkt.go .hrv{opacity:1;transform:none}
/* progress + curtain */
.mkt .sprog{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;pointer-events:none;background:linear-gradient(90deg,var(--teal-hi),var(--violet),var(--gold));transform:scaleX(0);transform-origin:0 50%}
.mkt .sk-intro{position:fixed;inset:0;z-index:150;background:var(--paper);display:grid;place-items:center;animation:mkCurtain .65s cubic-bezier(.16,.8,.26,1) 2.1s forwards}
.mkt .sk-intro.gone{animation:none;transform:translateY(-101%);opacity:0;visibility:hidden}
@keyframes mkCurtain{to{transform:translateY(-101%);opacity:0;visibility:hidden}}
.mkt .sk-intro .iis{stroke-dasharray:130;stroke-dashoffset:130;animation:mkDraw 1s cubic-bezier(.16,.8,.26,1) .15s forwards}
.mkt .sk-intro .iit{stroke-dasharray:20;stroke-dashoffset:20;animation:mkDraw .35s ease .95s forwards}
.mkt .sk-intro .iib{transform:scale(0);transform-origin:41px 22px;transform-box:view-box;animation:mkPopIn .4s cubic-bezier(.34,1.56,.64,1) 1.2s forwards}
.mkt .sk-intro .iw{font-size:30px;font-weight:800;letter-spacing:-.02em;opacity:0;transform:translateY(12px);animation:mkWordUp .5s cubic-bezier(.16,.8,.26,1) 1s forwards}
@keyframes mkPopIn{to{transform:scale(1)}} @keyframes mkWordUp{to{opacity:1;transform:none}} @keyframes mkDraw{to{stroke-dashoffset:0}}
/* nav */
.mkt .mnav{position:sticky;top:0;z-index:80;background:rgba(252,253,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s}
.mkt .mnav.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 30px -20px rgba(16,36,59,.25)}
.mkt .mnav-in{max-width:1140px;margin:0 auto;padding:0 24px;height:66px;display:flex;align-items:center;gap:2px;flex-wrap:nowrap}
.mkt .mnav .logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.03em;margin-right:14px;white-space:nowrap}
.mkt .mnav a.lnk{font-size:13.5px;font-weight:700;color:var(--muted);padding:8px 10px;border-radius:999px;white-space:nowrap;transition:color .2s,background .2s}
.mkt .mnav a.lnk:hover{color:var(--ink);background:var(--paper2)} .mkt .mnav a.lnk.on{color:var(--teal);background:var(--teal-soft)}
.mkt .mnav-call{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;color:var(--ink);border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap;transition:border-color .2s,color .2s} .mkt .mnav-call:hover{border-color:var(--teal);color:var(--teal)}
.mkt .mnav-cta{margin-left:8px;white-space:nowrap}

.mkt .mnav-burger{display:none;margin-left:auto;background:#fff;border:1.5px solid var(--line2);border-radius:12px;width:44px;height:44px;place-items:center;cursor:pointer}
.mkt .mnav-menu{display:none;border-top:1px solid var(--line);background:#fff;padding:8px 0 14px}
.mkt .mnav-menu a{display:block;padding:14px 24px;font-weight:700;border-bottom:1px solid var(--line)} .mkt .mnav-menu a.on{color:var(--teal)} .mkt .mnav-menu .btn{margin:14px 24px 0}

/* hero — ★ FIX: min-height 86vh removed; it sizes to its content now */
.mkt .hero{display:flex;align-items:center;position:relative;overflow:hidden;padding:clamp(24px,3.5vw,40px) 0 clamp(24px,3.5vw,44px);background:radial-gradient(ellipse 46% 40% at 82% 12%,rgba(109,74,255,.1),transparent 70%),radial-gradient(ellipse 50% 45% at 10% 85%,rgba(20,184,166,.12),transparent 70%),radial-gradient(ellipse 30% 30% at 60% 90%,rgba(255,122,69,.08),transparent 70%),var(--paper)}
.mkt .dots{position:absolute;inset:0;background:radial-gradient(rgba(16,36,59,.1) 1.1px,transparent 1.3px) 0 0/26px 26px;-webkit-mask-image:radial-gradient(ellipse 75% 60% at 50% 40%,#000 20%,transparent 72%);mask-image:radial-gradient(ellipse 75% 60% at 50% 40%,#000 20%,transparent 72%);pointer-events:none}
.mkt .aura{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;will-change:transform;animation:mkAura 18s ease-in-out infinite alternate}
.mkt .aura.a1{width:420px;height:420px;top:-120px;right:-80px;background:radial-gradient(circle,rgba(109,74,255,.35),transparent 65%)}
.mkt .aura.a2{width:380px;height:380px;bottom:-140px;left:-100px;background:radial-gradient(circle,rgba(20,184,166,.4),transparent 65%);animation-delay:-6s}
.mkt .aura.a3{width:300px;height:300px;bottom:-60px;left:45%;background:radial-gradient(circle,rgba(255,122,69,.28),transparent 65%);animation-delay:-12s}
@keyframes mkAura{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-30px) scale(1.15)}}

.mkt .ln{display:block;overflow:hidden;padding-bottom:.24em;margin-bottom:-.24em}
.mkt .ln i{display:block;font-style:normal;transform:translateY(130%);transition:transform .9s cubic-bezier(.16,.9,.24,1) var(--d,0s)} .mkt.go .ln i{transform:none}
.mkt .hero-in{position:relative;display:grid;grid-template-columns:1.08fr .92fr;gap:56px;align-items:center;width:100%}

.mkt .hero .lede{margin:16px 0 20px} .mkt .hero-ctas{display:flex;gap:14px;flex-wrap:wrap}
.mkt .hero-call{margin-top:12px;font-size:13.5px;font-weight:600;color:var(--muted)} .mkt .hero-call a{color:var(--teal);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.mkt .hl{position:relative;white-space:nowrap}
.mkt .hl svg{position:absolute;left:-2%;bottom:-.14em;width:104%;height:.34em;overflow:visible}
.mkt .hl path{fill:none;stroke:var(--coral);stroke-width:7;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320} .mkt.go .hl path{animation:mkDraw 1s 1.1s cubic-bezier(.4,0,.2,1) forwards}
.mkt .trust{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.mkt .trust .t{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 13px;box-shadow:var(--sh)}
.mkt .trust .t b{display:block;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--teal),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.mkt .trust .t span{font-size:12px;color:var(--muted);font-weight:600}
.mkt .stage{position:relative;perspective:1200px}
.mkt .browser{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 40px 80px -30px rgba(16,36,59,.28);overflow:hidden;transform:rotate(1.2deg);transition:transform .35s ease-out}
.mkt .bbar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line);background:#f7fafc}
.mkt .bbar i{width:10px;height:10px;border-radius:50%;display:block}
.mkt .bbar .url{margin-left:8px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 14px;min-height:23px;min-width:150px}
.mkt .url .caret{display:inline-block;width:7px;height:11px;margin-left:2px;vertical-align:-1px;background:var(--teal-hi);animation:mkCaret .85s steps(1) infinite} @keyframes mkCaret{50%{opacity:0}}
.mkt .bhero{padding:18px 20px;background:linear-gradient(135deg,#e8fbf7,#f0edff)}
.mkt .bld{opacity:0;transform:translateY(14px);transition:opacity .55s cubic-bezier(.16,.8,.26,1) var(--d,0s),transform .55s cubic-bezier(.16,.8,.26,1) var(--d,0s)} .mkt.built .bld{opacity:1;transform:none}
.mkt .bhero .tag{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--teal)}
.mkt .bhero h4{font-size:18px;margin:6px 0 4px;font-weight:800} .mkt .bhero p{font-size:12px;color:var(--muted)}
.mkt .bhero .mini{margin-top:12px;display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:800;padding:7px 16px;border-radius:999px}
.mkt .brow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px 18px 16px}
.mkt .bcell{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:10.5px;color:var(--muted);font-weight:700} .mkt .bcell b{display:block;font-size:13px;color:var(--ink)}
.mkt .chip{position:absolute;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 16px;box-shadow:var(--sh-lift);animation:mkBob 6s ease-in-out infinite;transition:border-color .4s,box-shadow .4s;z-index:3}
.mkt .chip .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px} .mkt .chip b{font-size:12.5px;display:block;line-height:1.3} .mkt .chip span{font-size:10.5px;color:var(--muted);font-weight:600}
.mkt .ch1{top:-26px;left:-30px} .mkt .ch2{right:-26px;top:38%;animation-delay:-2s} .mkt .ch3{bottom:-24px;left:12%;animation-delay:-4s}

@keyframes mkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mkt .chip.live{border-color:var(--teal-hi);box-shadow:0 4px 10px rgba(16,36,59,.06),0 30px 60px -20px rgba(13,148,136,.45),0 0 0 4px rgba(20,184,166,.14)}
.mkt .chip .ping{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--teal-hi);border:2px solid #fff;opacity:0;transform:scale(0);transition:opacity .3s,transform .3s cubic-bezier(.34,1.56,.64,1)} .mkt .chip.live .ping{opacity:1;transform:scale(1)}
/* marquee */
.mkt .marq{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;padding:14px 0;overflow:hidden;display:grid;gap:10px}
.mkt .marq .track{display:flex;gap:14px;width:max-content;animation:mkSlide 30s linear infinite} .mkt .marq .track.rev{animation:mkSlideRev 36s linear infinite} .mkt .marq:hover .track{animation-play-state:paused}
@keyframes mkSlide{to{transform:translateX(-50%)}} @keyframes mkSlideRev{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.mkt .mchip{font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:7px 18px;white-space:nowrap;transition:color .25s,border-color .25s} .mkt .mchip:hover{color:var(--teal);border-color:var(--teal-hi)} .mkt .mchip b{color:var(--teal)}
/* flip cards */
.mkt .feat{grid-template-columns:repeat(4,1fr);perspective:1600px;gap:12px}
 
/* ★ FIX — was min-height:330px on every card, including phones */
.mkt .fl{display:grid;cursor:pointer;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.25,.85,.3,1.02);min-height:clamp(150px,11.5vw,174px)}
.mkt .fl.flipped{transform:rotateY(180deg)} .mkt .fl:not(.flipped):hover{transform:translateY(-8px) rotateY(-4deg)}
.mkt .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;position:relative}
.mkt .front{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);transition:box-shadow .35s,border-color .35s} .mkt .fl:not(.flipped):hover .front{border-color:var(--teal-hi)} .mkt .fl:not(.flipped):hover .front{box-shadow:var(--sh-lift)}

.mkt .front .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;margin-bottom:8px;transition:transform .4s cubic-bezier(.3,1.6,.5,1)} .mkt .fl:not(.flipped):hover .ic{transform:scale(1.14) rotate(-6deg)}
.mkt .ic.t{background:var(--teal-soft)} .mkt .ic.v{background:var(--violet-soft)} .mkt .ic.c{background:var(--coral-soft)} .mkt .ic.g{background:var(--gold-soft)} .mkt .ic.s{background:var(--sky-soft)}
.mkt .front h3{font-size:.95rem;margin:0 0 4px;padding-right:44px} .mkt .front p{font-size:12.5px;color:var(--muted);line-height:1.45;margin-bottom:12px}
.mkt .front .cb{margin-top:auto;width:100%;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--teal);display:flex;justify-content:space-between;align-items:center} .mkt .front .cb i{font-style:normal;transition:transform .2s} .mkt .fl:not(.flipped):hover .cb i{transform:translateX(4px)}
.mkt .front .nw{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#b27200;background:var(--gold-soft);padding:3px 8px;border-radius:999px}
.mkt .back{transform:rotateY(180deg);justify-content:center;color:#fff;box-shadow:var(--sh-lift);background:radial-gradient(ellipse 90% 70% at 85% -10%,rgba(20,184,166,.35),transparent 60%),radial-gradient(ellipse 70% 60% at 0% 110%,rgba(109,74,255,.3),transparent 60%),var(--ink)}
.mkt .back .x{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.14);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px}
.mkt .back h4{font-size:1.1rem;margin-bottom:4px} .mkt .back .bform,.mkt .back .ok{width:100%} .mkt .back .bform p{font-size:13px;color:#aec2d6;margin-bottom:14px} .mkt .back .bform p b{color:#7ee8dc}
.mkt .back input{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-family:inherit} .mkt .back input::placeholder{color:#7e96ad} .mkt .back input:focus{outline:none;border-color:var(--teal-hi);box-shadow:0 0 0 4px rgba(20,184,166,.25)}
.mkt .back .send{width:100%;justify-content:center;margin-top:12px} .mkt .back .ok{text-align:center}
.mkt .back .ok .tick{width:56px;height:56px;border-radius:50%;background:rgba(20,184,166,.22);display:grid;place-items:center;font-size:25px;color:#7ee8dc;margin:0 auto 12px;animation:mkPop .4s both} .mkt .back .ok p{font-size:12.5px;color:#aec2d6;margin-top:6px}
.mkt .hint{margin-top:10px;font-size:13px;font-weight:700;color:var(--dim)}
/* deck */
.mkt .show-sec{background:#fff;border-top:1px solid var(--line)}
.mkt .deck{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:26px;perspective:1400px}
 
.mkt .dkw{opacity:0;transform:translateY(70px) rotate(calc(-8deg + var(--i,0)*3deg)) scale(.85);transition:opacity .7s cubic-bezier(.2,.9,.3,1.1) calc(var(--i,0)*.09s),transform .7s cubic-bezier(.2,.9,.3,1.1) calc(var(--i,0)*.09s)}
.mkt .deck.in .dkw{opacity:1;transform:none;animation:mkDeckFloat 6s ease-in-out calc(1.2s + var(--i,0)*1.1s) infinite}
@keyframes mkDeckFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
/* ★ FIX — was min-height:210px */
.mkt .dk{position:relative;border-radius:20px;padding:18px 16px 16px;min-height:clamp(130px,12vw,160px);color:#fff;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 26px 55px -22px rgba(16,36,59,.4);transform:rotateY(-9deg) rotateX(4deg);transition:transform .45s cubic-bezier(.2,.8,.3,1.15)}
.mkt .dkw:nth-child(2n) .dk{transform:rotateY(9deg) rotateX(4deg)} .mkt .dk:hover{transform:rotateY(0) rotateX(0) translateY(-10px) scale(1.06)!important;z-index:2}
.mkt .dk .em{font-size:34px;margin-bottom:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3));transition:transform .4s cubic-bezier(.3,1.6,.5,1)} .mkt .dk:hover .em{transform:scale(1.25) rotate(-8deg)}

.mkt .ptag{position:relative;margin-top:30px;display:inline-grid;grid-template-columns:auto minmax(0,1fr);gap:0 16px;align-items:center;background:#fff;border:1.5px solid var(--gold);border-radius:14px 22px 22px 14px;padding:13px 18px 13px 24px;box-shadow:0 14px 30px -14px rgba(245,166,35,.55),var(--sh);transform-origin:9px 50%;animation:mkTagSwing 6s ease-in-out infinite;text-decoration:none;color:inherit;max-width:100%;transition:box-shadow .3s,border-color .3s}
.mkt .ptag:hover{border-color:#e08e0b;box-shadow:0 18px 36px -14px rgba(245,166,35,.7),var(--sh-lift)}
.mkt .ptag::before{content:"";position:absolute;left:9px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--paper);border:1.5px solid var(--gold);box-shadow:inset 0 0 0 2px #fff}
.mkt .ptag::after{content:"";position:absolute;left:13px;top:-24px;width:2px;height:26px;background:var(--coral);border-radius:2px;transform:rotate(-20deg);transform-origin:bottom}
.mkt .ptag .amt{display:block;font-size:2.2rem;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.mkt .ptag .amt [data-from]{background:linear-gradient(90deg,var(--teal),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.mkt .ptag .amt small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:800;margin-top:3px}
.mkt .ptag .tx{display:block;min-width:0}.mkt .ptag .tx b{display:block;font-size:14.5px;letter-spacing:-.01em;line-height:1.25}.mkt .ptag .tx span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.35}.mkt .ptag .tx i{display:inline-block;font-style:normal;margin-top:6px;font-size:12.5px;font-weight:800;color:var(--teal)}
@keyframes mkTagSwing{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.mkt.go .ptag.hrv{animation:mkTagSwing 6s ease-in-out infinite}
@media(max-width:560px){.mkt .ptag{display:grid;width:100%;margin-top:28px;padding:12px 14px 12px 22px;gap:0 12px}.mkt .ptag .amt{font-size:1.9rem}.mkt .ptag .amt small{white-space:normal;max-width:88px;line-height:1.2;font-size:9.5px;letter-spacing:.05em}.mkt .ptag .tx b{font-size:13.5px}.mkt .ptag .tx span{font-size:12px}}

@media(prefers-reduced-motion:reduce){.mkt .ptag,.mkt.go .ptag.hrv{animation:none}}

/* ═════════ motion (ported from useMarketingMotion) ═════════ */
const root=document.getElementById('root'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let io=null,cio=null,chipTimer=null,proTimer=null,proActive=0,proPaused=false;
function observe(){io&&io.disconnect();cio&&cio.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
  root.querySelectorAll('.rv, [data-a], .vs .col, .mission').forEach(n=>io.observe(n));
  cio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;cio.unobserve(e.target);const n=e.target,end=+n.dataset.count;if(reduced){n.textContent=end;return;}const t0=performance.now();const step=t=>{const p=Math.min((t-t0)/1400,1);n.textContent=Math.round(end*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}),{threshold:.15});
  if(root.classList.contains('go'))root.querySelectorAll('[data-count]').forEach(n=>cio.observe(n));
  setTimeout(revealByGeometry,120);}
/* Belt and braces: IntersectionObserver callbacks are deferred in background tabs and some
   embedded frames. Anything already inside the viewport by geometry reveals on the next scroll
   frame regardless, so a reader never meets a blank section. */
function revealByGeometry(){if(!root.classList.contains('go'))return;const h=innerHeight;root.querySelectorAll('.rv:not(.in), [data-a]:not(.in), .vs .col:not(.in), .mission:not(.in)').forEach(n=>{const r=n.getBoundingClientRect();if(r.top<h*.92&&r.bottom>0)n.classList.add('in');});
  root.querySelectorAll('[data-count]').forEach(n=>{if(n.dataset.done)return;const r=n.getBoundingClientRect();if(r.top<h&&r.bottom>0){n.dataset.done='1';const end=+n.dataset.count;if(reduced){n.textContent=end;return;}const t0=performance.now();const step=t=>{const p=Math.min((t-t0)/1400,1);n.textContent=Math.round(end*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}});}
function typeUrl(){const tu=root.querySelector('.url .tu');if(!tu)return;const full=tu.textContent;tu.textContent='';let i=0;const iv=setInterval(()=>{i++;tu.textContent=full.slice(0,i);if(i>=full.length)clearInterval(iv);},55);}
function heroLoop(){clearInterval(chipTimer);if(reduced)return;const chips=[...root.querySelectorAll('.chip')];let i=-1;chipTimer=setInterval(()=>{if(!root.classList.contains('go'))return;if(i>=0)chips[i]?.classList.remove('live');i=(i+1)%chips.length;chips[i]?.classList.add('live');},2600);
  if(matchMedia('(pointer: fine)').matches){const stage=root.querySelector('.stage'),b=document.getElementById('browser');if(stage&&b){let raf=0;stage.onmousemove=ev=>{const r=stage.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{b.style.transform=`rotate(1.2deg) rotateX(${(-y*6).toFixed(2)}deg) rotateY(${(x*8).toFixed(2)}deg)`;});};stage.onmouseleave=()=>{cancelAnimationFrame(raf);b.style.transform='';};}}}
function setPro(i){proActive=i;const th=document.getElementById('proth');if(!th)return;th.style.cssText='transition-delay:.18s;'+PILLARS[i].vars;document.querySelectorAll('.pro-item').forEach((el,k)=>{el.classList.toggle('on',k===i);el.querySelector('.pro-tab').setAttribute('aria-selected',k===i);});

(function intro(){let seen=false;try{seen=sessionStorage.getItem('sk-intro')==='1';sessionStorage.setItem('sk-intro','1');}catch(e){}

(function scrollFx(){const prog=document.getElementById('sprog'),nav=document.getElementById('nav');let t=false,last=0;const on=()=>{
