# QA lens: negative / auth-failure. Wrong password must be rejected with a
# visible error and must NOT navigate into the app.
appId: com.sckools.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "school-code"
- inputText: "raffles"
- tapOn:
    id: "connect-btn"
- tapOn:
    id: "login-id"
- inputText: "anjali.desai@raffles.edu"
- tapOn:
    id: "login-pw"
- inputText: "definitely-wrong-password"
- tapOn:
    id: "login-btn"
# Must still be on the login screen (no portal tabs), and the login button
# remains — i.e., the bad credentials did not grant access.
- assertVisible:
    id: "login-btn"
- assertNotVisible: "Today"
- assertNotVisible: "Home"
