name: db-migrate

# Applies the repo's Prisma migrations to a chosen database.
#
# WHY THIS EXISTS: until now, standing up or updating a database meant pasting
# SQL into the Supabase editor by hand, in the right order, and hoping. That is
# how staging ended up four migrations behind main without anyone noticing, and
# why "create a new staging DB" felt like a project rather than a button.
#
# The migrations in packages/db/prisma/migrations ARE the schema — this
# workflow just makes the repo able to apply them to any target, so a fresh
# Supabase project is bootstrapped in one run and no credential ever passes
# through a chat window or a person's clipboard.
#
# `prisma migrate deploy` is the production-safe command: it applies only
# migrations not yet in the target's _prisma_migrations table, never generates
# new ones, never resets, and is a no-op when the target is already current. So
# re-running this is always safe.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database to migrate
        required: true
        type: choice
        options: [staging, production]
      seed:
        description: >-
          Also seed demo data (schools, test logins). Only for a BRAND-NEW
          database — it is refused against production below.
        required: false
        type: boolean
        default: false
      inspect_only:
        description: >-
          Change NOTHING. Print the migration history and the schema drift, then
          stop. The question "what does this database actually have?" needed the
          production password on someone's laptop until this existed, which is
          why a hand-applied migration could sit unrecorded for months.
        required: false
        type: boolean
        default: false
      resolve_applied:
        description: >-
          RECOVERY ONLY — a migration name to record as already applied,
          WITHOUT running its SQL. For a database whose schema has the objects
          but whose _prisma_migrations lost (or never got) the row, which is
          what hand-applied migrations leave behind. Also clears a failed row,
          which otherwise blocks every later migration.
        required: false
        type: string
        default: ''

  # Auto-apply to staging whenever a migration lands on the staging branch, so
  # code and schema can never drift apart there again. Production stays manual
  # and deliberate.
  push:
    branches: [staging]
    paths:
      - 'packages/db/prisma/migrations/**'

concurrency:
  # Never let two migration runs touch the same database at once.
  group: db-migrate-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # GitHub Environments hold the secrets AND can require a human approval
    # before a production run — see the setup notes in docs/DATABASE.md.
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Refuse to seed production
        if: ${{ github.event.inputs.seed == 'true' && github.event.inputs.environment == 'production' }}
        run: |
          echo "::error::Seeding writes demo schools and known-password logins. Never production."
          exit 1

      - name: Inspect only — what does this database actually have?
        if: ${{ github.event.inputs.inspect_only == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "=== migration history ==="
          pnpm --filter @skoolos/db exec prisma migrate status || true
          echo
          echo "=== schema drift ==="
          echo "SQL below = what this database is MISSING relative to schema.prisma."
          echo "No SQL below = the schema already matches, whatever the history says."
          # `migrate diff` reads the live schema and compares it to the datamodel.
          # It is the only way to tell a database that genuinely lacks a table
          # from one that has the table and merely lost the row saying so — and
          # that distinction is exactly what makes `resolve --applied` safe or
          # catastrophic.
          pnpm --filter @skoolos/db exec prisma migrate diff \
            --from-url "$DIRECT_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script || true

      # Runs BEFORE the status/deploy below, because a failed or missing row is
      # exactly what stops those two from being able to say anything useful.
      # `migrate resolve --applied` writes the bookkeeping row and nothing else:
      # it never touches the schema, so it can only ever be wrong about history,
      # never destructive. Verify the objects really exist before using it —
      # marking a migration applied that did NOT run leaves a database that
      # passes `migrate status` and fails at runtime on the first query.
      - name: Record ${{ github.event.inputs.resolve_applied }} as already applied
        if: ${{ github.event.inputs.resolve_applied != '' && github.event.inputs.inspect_only != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          pnpm --filter @skoolos/db exec prisma migrate resolve \
            --applied "${{ github.event.inputs.resolve_applied }}"

      - name: Show what will be applied
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          # `migrate status` is read-only. Running it first means the log says
          # what WOULD change before anything does — the record you want when a
          # deploy goes wrong at 11pm.
          pnpm --filter @skoolos/db exec prisma migrate status || true

      - name: Apply migrations
        if: ${{ github.event.inputs.inspect_only != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm --filter @skoolos/db exec prisma migrate deploy

      - name: Seed demo data
        if: ${{ github.event.inputs.seed == 'true' && github.event.inputs.inspect_only != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          # seed.ts calls loadEnv(), which reads a root .env and OVERRIDES the
          # environment — on a developer's machine that silently redirects the
          # seed at their local docker database while printing success. CI has
          # no root .env, so writing one here is what makes the seed land on
          # the intended target.
          printf 'DATABASE_URL="%s"\nDIRECT_URL="%s"\n' "$DATABASE_URL" "$DIRECT_URL" > .env
          pnpm --filter @skoolos/db exec tsx prisma/seed.ts

      - name: Confirm the target is current
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm --filter @skoolos/db exec prisma migrate status
