# Launch-gate #6: pushes within minutes, not tomorrow.
#
# A notification that misses its inline send lands in the outbox — and the
# only drain was the daily 02:00 Vercel cron (Hobby's ceiling), so a missed
# diary push could arrive the NEXT MORNING. This workflow is the free external
# scheduler from the launch-gate plan: every 10 minutes it calls the drain
# endpoint the API already ships (`@Public()` + CronSecretGuard — built for
# exactly this caller).
#
# Setup (repo → Settings → Secrets and variables → Actions):
#   CRON_SECRET — must equal the API's CRON_SECRET env on Vercel.
#   CRON_API_BASE (variable, optional) — defaults to the production API.
#
# GitHub schedules are best-effort (a run can slip a few minutes under load);
# that is fine here — the guarantee we need is "minutes, not tomorrow".
# Remove this workflow once the project moves to Vercel Pro and a native
# `*/5` cron replaces it (checkpoint-1 item).
#
# Caveats that live in the RUNBOOK too:
# - Scheduled workflows run from the DEFAULT branch only — inert until this
#   file is on main — and GitHub pauses schedules after 60 days of repo
#   inactivity (Actions shows "This scheduled workflow is disabled").
# - So scheduled runs come from main and hit the PRODUCTION API (the
#   CRON_API_BASE default). Staging is never drained from here: it relies on
#   the drain each notifying write asks for, and on its own 02:00 UTC cron.
# - Overlap is safe. The drain claims outbox rows and deliveries with
#   FOR UPDATE SKIP LOCKED plus a claimedAt stamp, so a run that overlaps
#   another, a write's own drain or the 02:00 UTC Vercel cron never takes the
#   same delivery twice. The minute offset (3,13,…,53) only spreads load.
#   `concurrency` below still keeps one run of this workflow at a time, so a
#   slow run's call loop is never doubled by the next tick.

name: Drain notification outbox

on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch: {}

permissions: {}

# One run at a time; the next tick waits rather than cancelling a run mid-drain.
concurrency:
  group: outbox-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # Up to 8 calls of at most 55 s each (see the loop below).
    timeout-minutes: 9
    steps:
      - name: Call the drain endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE: ${{ vars.CRON_API_BASE || 'https://api.sckools.com' }}
        run: |
          set -euo pipefail
          # Not configured yet is a SETUP state, not a failure. This runs every
          # 10 minutes, so exiting 1 here sent a failed-run email every 10
          # minutes forever — which is how a real drain outage would announce
          # itself too, so the noise actively hid the signal it was meant to
          # carry. Skip with a notice instead, and keep failing loudly for
          # anything that goes wrong once the secret IS set.
          if [ -z "${CRON_SECRET}" ]; then
            echo "::notice title=Outbox drain skipped::CRON_SECRET is not configured, so the outbox is not being drained. Set it in repo Settings → Secrets → Actions (it must equal the API's CRON_SECRET on Vercel)."
            exit 0
          fi
          # Call again while the drain says `more` (a claim came back full, or
          # the deadline ended the run), at most 8 calls per run. Each call is
          # its own serverless invocation with its own 60 s, so this is not a
          # chained drain; no sleep is needed between calls.
          for call in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 55 \
              -X POST "${API_BASE}/internal/cron/notification-outbox" \
              -H "Authorization: Bearer ${CRON_SECRET}")
            echo "Call ${call}: HTTP ${code}"; cat /tmp/body; echo
            if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
              exit 1
            fi
            more=$(jq -r '.more // false' /tmp/body 2>/dev/null || echo false)
            if [ "${more}" != "true" ]; then
              break
            fi
          done
