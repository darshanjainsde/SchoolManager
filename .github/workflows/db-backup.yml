# Launch-gate #3: backups you have actually restored.
#
# This is the SECOND copy in the two-path recovery story:
#   1. Supabase PITR (dashboard add-on) — the "undo the last 10 minutes"
#      button, restores to any second. Enable it in the Supabase dashboard;
#      it is a database setting, not code.
#   2. THIS workflow — a nightly logical pg_dump held OUTSIDE Supabase, for
#      provider-level disaster (account lockout, region loss, billing acc-
#      idents). Coarse (24 h) by design; PITR covers the fine-grained cases.
#
# Setup (repo → Settings → Secrets and variables → Actions):
#   DB_BACKUP_URL — the SESSION pooler connection string (port 5432). The
#     transaction pooler (:6543) breaks pg_dump; use the session string that
#     migrations already use.
#   Optional offsite S3 (recommended once available):
#     BACKUP_S3_BUCKET / BACKUP_S3_ACCESS_KEY / BACKUP_S3_SECRET_KEY /
#     BACKUP_S3_ENDPOINT — any S3-compatible store OUTSIDE Supabase.
#     Without them the dump is kept as a private repo artifact (30 days),
#     which is already an independent copy under a different account system.
#
# The restore path is written down and REHEARSED — see docs/RUNBOOK.md
# ("Restore drill"). A backup nobody has restored is a hope, not a backup.

name: Nightly database backup

on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST, after the app's own 02:00/03:00 UTC crons window
  workflow_dispatch: {}

permissions: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Dump
        env:
          DB_BACKUP_URL: ${{ secrets.DB_BACKUP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_BACKUP_URL}" ]; then
            echo "DB_BACKUP_URL secret is not configured" >&2; exit 1
          fi
          stamp=$(date -u +%Y%m%d-%H%M)
          pg_dump "${DB_BACKUP_URL}" \
            --format=custom --no-owner --no-privileges \
            --file="skoolos-${stamp}.dump"
          gzip -9 "skoolos-${stamp}.dump"
          ls -lh skoolos-*.dump.gz
          echo "STAMP=${stamp}" >> "$GITHUB_ENV"

      - name: Offsite upload (S3), when configured
        env:
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET:-}" ]; then
            echo "No S3 bucket configured — keeping the artifact copy only."
            exit 0
          fi
          aws s3 cp "skoolos-${STAMP}.dump.gz" "s3://${BUCKET}/nightly/skoolos-${STAMP}.dump.gz"

      - name: Keep as private artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: skoolos-*.dump.gz
          retention-days: 30
          if-no-files-found: error
