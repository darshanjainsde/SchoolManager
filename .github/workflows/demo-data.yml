name: demo-data

# Loads demo data into ONE school on staging, so the product can be tested
# against something that looks like a real school rather than an empty page.
#
# Two scripts, in order. The whole-school one builds the frame — grades, roll,
# timetable, attendance, marks, library, notices — and the alumni one layers its
# wing on top and needs the roll to exist first, because a gift's quantity IS
# the live headcount. Beacon had ONE active student, which made every gifting
# screen read as broken while being perfectly correct.
#
# WHY A WORKFLOW: the same reason db-migrate is one — the credentials live in a
# GitHub Environment and never pass through a chat window or a laptop. It also
# means the run is logged, repeatable, and reviewable after the fact.
#
# STAGING ONLY, and not by policy alone: there is no production option to pick.
# This writes people who do not exist, a login with a known password, and
# pledges nobody made. None of that belongs near a real school's data, so the
# safest design is one where the dangerous choice cannot be expressed.
#
# Re-running is safe. Every write is an upsert keyed on something stable, and
# the script touches nothing outside the alumni tables plus one FeatureOverride.

on:
  workflow_dispatch:
    inputs:
      school:
        description: Which school slug to load the demo data into
        required: true
        type: string
        default: raffles
      whole_school:
        description: >-
          Also build the school itself — grades, roll, timetable, attendance,
          marks, library, notices. Creates the school and its hostname if they
          do not exist. Leave off to refresh only the alumni wing.
        required: false
        type: boolean
        default: true
      dry_run:
        description: >-
          Change NOTHING. Resolve the school, print which database it actually
          reached, and list what would be written. Run this first.
        required: false
        type: boolean
        default: false

  # workflow_dispatch alone is not enough: GitHub only registers that trigger
  # for workflows present on the DEFAULT branch, and this one deliberately
  # never goes to main. So staging also runs it on push, the same way
  # db-migrate auto-applies migrations there — and for the same reason, that
  # the environment which exists to be tested should not need a person to
  # remember to refresh it.
  push:
    branches: [staging]
    paths:
      - 'packages/db/prisma/seed-alumni-demo.ts'
      - 'packages/db/prisma/seed-school-demo.ts'
      - '.github/workflows/alumni-demo-data.yml'

concurrency:
  group: demo-data-staging
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      # The seed writes rows carrying enum values and columns that only exist
      # after a migration. Both this workflow and db-migrate trigger on the same
      # push to staging, and they START AT THE SAME MOMENT — so "the migration
      # will have run by now" is a race, not a guarantee. It happened to WIN the
      # first time, which is the worst way for a race to behave, because it
      # looks like a design.
      #
      # `migrate deploy` is a no-op against a database that is already current,
      # so this costs nothing and makes the seed responsible for its own
      # preconditions rather than for its luck.
      - name: Make sure the schema is there first
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm --filter @skoolos/db exec prisma migrate deploy

      # Always, even on the real run: it prints which database was actually
      # reached and resolves the school, so a wrong target or a missing school
      # fails HERE, before anything is written.
      - name: Dry run first — where does this actually land?
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DEMO_SCHOOL_SLUG: ${{ github.event.inputs.school || 'raffles' }}
          DEMO_DRY_RUN: 'true'
        run: pnpm --filter @skoolos/db exec tsx prisma/seed-alumni-demo.ts

      # The frame first: the alumni wing prices its gifts against the live
      # headcount, so seeding it into an empty school produces pledges for one
      # child and screens that look broken.
      - name: Build the school
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.whole_school != 'false' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DEMO_SCHOOL_SLUG: ${{ github.event.inputs.school || 'raffles' }}
          DEMO_DRY_RUN: 'false'
        run: pnpm --filter @skoolos/db exec tsx prisma/seed-school-demo.ts

      - name: Load the alumni demo data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          # The script's clients read DATABASE_URL_APP / DATABASE_URL_PLATFORM
          # FIRST and fall back to DATABASE_URL. Setting only DATABASE_URL is
          # correct here because neither specific variable exists in this
          # environment — but it is spelled out because a half-set environment
          # silently sends the writes somewhere else, which is exactly the
          # failure this comment exists to prevent.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DEMO_SCHOOL_SLUG: ${{ github.event.inputs.school || 'raffles' }}
          DEMO_DRY_RUN: 'false'
        run: pnpm --filter @skoolos/db exec tsx prisma/seed-alumni-demo.ts

      - name: What to do next
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Feature flags are cached in Redis for 300s — give it five"
          echo "minutes, or hard-refresh, before the alumni tab appears."
