name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Module boundary check
        run: pnpm boundary

      - name: Build
        run: pnpm build

      # The Sckools packages only. @library/db's suite is live-only — it needs a
      # real Postgres and deliberately HARD-FAILS rather than skipping when
      # process.env.CI is set without one (packages/library-db/src/test-live.ts),
      # because a silent skip in CI is a false green. This job has no database,
      # so those tests belong to `library-ci`'s `e2e` job, which stands one up
      # and already runs them. Lint/typecheck/build above still cover every
      # package here — only the DB-backed tests are scoped out.
      - name: Unit tests
        run: pnpm test --filter '!@library/*'
