name: db-drift

# Answers one question on a schedule: is each live database actually running
# the schema this repo says it should?
#
# WHY: staging sat four migrations behind main for days and nothing said so.
# The web build failing was the first symptom, and it was unrelated. A database
# that silently lags its code fails at RUNTIME, on a real user, on the one
# endpoint that touches the missing table — which is the worst place to find
# out.
#
# `prisma migrate status` is READ-ONLY. This workflow can never modify a
# database; it exits non-zero (and so fails loudly, and emails you) when a
# target has migrations pending.

on:
  schedule:
    # 06:30 IST daily — before the school day, so a drift is caught before
    # anyone is using the thing.
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false # report BOTH environments; one being behind must not hide the other
      matrix:
        environment: [staging, production]

    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Is ${{ matrix.environment }} up to date?
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -o pipefail
          # A MISSING ANSWER IS NOT A CLEAN ANSWER. `prisma migrate status`
          # exits non-zero for pending migrations AND for every other reason —
          # no credentials, unreachable host, invalid schema. Reporting all of
          # them as "migrations pending" is how this check spent days claiming
          # a drift that did not exist while the real fault (empty
          # DATABASE_URL/DIRECT_URL on this GitHub environment) went unread.
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "::error::${{ matrix.environment }}: DATABASE_URL/DIRECT_URL are empty on this GitHub environment, so NOTHING was checked — this is not a drift report. Add both under Settings → Environments → ${{ matrix.environment }} → Environment secrets."
            exit 1
          fi
          if pnpm --filter @skoolos/db exec prisma migrate status 2>&1 | tee status.txt; then
            echo "✓ ${{ matrix.environment }} matches the repo."
            exit 0
          fi
          if grep -qiE 'have not yet been applied|migrations? (is|are) pending' status.txt; then
            echo "::error::${{ matrix.environment }} has migrations pending — run the db-migrate workflow against it."
          else
            echo "::error::${{ matrix.environment }}: could not read migration status at all (see the log above). The database was never reached, so this says NOTHING about whether it has drifted."
          fi
          exit 1
