# Render blueprint — API + worker + Postgres + Redis.
#
# Limitations of the Render blueprint format that you'll need to address manually:
#   1. Render's managed Postgres has only one role (the database owner). The
#      app's RLS migration creates two non-superuser roles inside that DB
#      (skoolos_app, skoolos_platform). After first deploy, connect via
#      `render psql skoolos-pg` and rotate their passwords with
#         ALTER USER skoolos_app PASSWORD '<new>';
#         ALTER USER skoolos_platform PASSWORD '<new>';
#      Then update DATABASE_URL_APP / DATABASE_URL_PLATFORM env vars below.
#   2. Render Redis is not yet defined in some account tiers in YAML; add it
#      from the dashboard if `services: type: redis` isn't supported on your
#      plan.
#
# Secrets you must add manually on first deploy:
#   PLATFORM_HOST, PLATFORM_OWNER_HOST, INGRESS_CNAME_TARGET, INGRESS_A_RECORD

services:
  - type: web
    name: skoolos-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase: { name: skoolos-pg, property: connectionString }
      # Both _APP and _PLATFORM default to the superuser URL too — see header
      # comment for the post-deploy ALTER USER step that hardens them.
      - key: DATABASE_URL_APP
        fromDatabase: { name: skoolos-pg, property: connectionString }
      - key: DATABASE_URL_PLATFORM
        fromDatabase: { name: skoolos-pg, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: skoolos-redis, property: connectionString }
      - key: JWT_SCHOOL_ACCESS_SECRET
        generateValue: true
      - key: JWT_SCHOOL_REFRESH_SECRET
        generateValue: true
      - key: JWT_PLATFORM_ACCESS_SECRET
        generateValue: true
      - key: JWT_PLATFORM_REFRESH_SECRET
        generateValue: true
      - key: PLATFORM_SETTINGS_KEY
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 900
      - key: JWT_REFRESH_TTL
        value: 2592000
      - key: LOCKOUT_MAX_ATTEMPTS
        value: 5
      - key: LOCKOUT_DURATION_SECONDS
        value: 900
      - key: ENABLE_SWAGGER
        value: 'false'

  - type: worker
    name: skoolos-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_PORT
        value: 3002
      - key: DATABASE_URL
        fromDatabase: { name: skoolos-pg, property: connectionString }
      - key: DATABASE_URL_APP
        fromDatabase: { name: skoolos-pg, property: connectionString }
      - key: DATABASE_URL_PLATFORM
        fromDatabase: { name: skoolos-pg, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: skoolos-redis, property: connectionString }

databases:
  - name: skoolos-pg
    plan: starter
    postgresMajorVersion: 16
