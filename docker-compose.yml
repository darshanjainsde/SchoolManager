services:
  postgres:
    image: postgres:16-alpine
    container_name: skoolos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skoolos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skoolos}
      POSTGRES_DB: ${POSTGRES_DB:-skoolos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skoolos} -d ${POSTGRES_DB:-skoolos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: skoolos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: skoolos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-skoolosminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-skoolosminio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-bucket-init:
    image: minio/mc:latest
    container_name: skoolos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-skoolosminio} ${S3_SECRET_KEY:-skoolosminio} &&
      mc mb -p local/${S3_BUCKET:-skoolos} || true &&
      mc anonymous set download local/${S3_BUCKET:-skoolos} || true
      "
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: skoolos-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
